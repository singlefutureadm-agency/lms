spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Le backend/.env (mesmo arquivo que o docker compose usa para criar o
# container do Postgres) para dentro do Environment. Sem isso, DB_USERNAME/
# DB_PASSWORD só existem no .env e não chegam ao processo Java quando ele
# roda fora do docker compose (mvn/IDE), fazendo o app cair nos defaults de
# application-dev.properties, que não batem com a senha real do banco.
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver

# --- Virtual threads (Java 21+, adotado na migração para o Java 25) ---
# Cada request passa a rodar numa virtual thread em vez de uma thread da pool do
# Tomcat. Como esta API é I/O-bound (praticamente toda request espera o Postgres),
# a concorrência deixa de ser limitada pelo tamanho da pool de threads.
# O gargalo passa a ser a pool de conexões abaixo — é ela que precisa ser
# dimensionada, não mais o número de threads.
spring.threads.virtual.enabled=true

# --- Hikari ---
# max-lifetime abaixo do timeout do lado do servidor, para não pegar conexão
# derrubada pelo Postgres (isso já era necessário para o boot do Flyway).
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=lms-pool
spring.jpa.hibernate.ddl-auto=validate
# Com o mapeamento para DTO acontecendo dentro dos @Transactional dos Services,
# o open-in-view deixa de ser necessário — e mantê-lo ligado esconderia N+1
# atrás de lazy loading na serialização.
spring.jpa.open-in-view=false
# Resolve as coleções LAZY de todos os registros de uma página em poucos selects
# com IN (...), em vez de um select por registro.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# O dialeto explícito foi removido: desde o Hibernate 6 ele é detectado a partir da
# conexão, e fixá-lo desliga a resolução version-aware (Hibernate 7 desencoraja).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Teto de page size: sem isso, ?size=1000000 obriga o banco a materializar tudo.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
# Serializa Page como PagedModel ({content, page:{...}}) em vez do shape interno do
# PageImpl, que o Spring documenta como instável entre versões.
spring.data.web.pageable.serialization-mode=VIA_DTO

# --- Erros no formato RFC 7807 (application/problem+json) ---
spring.mvc.problemdetails.enabled=true

# --- Actuator: só health e info expostos ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs
server.port=8080
jwt.expiration-ms=86400000
app.upload.dir=${user.home}/lms-uploads
app.upload.base-url=http://localhost:8080
app.upload.video-max-size-mb=300
app.storage.provider=local
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=310MB
spring.servlet.multipart.max-request-size=320MB
